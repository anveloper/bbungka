name: 뻥카뉴스 기사 생성

# 오늘은 데모용으로 15분마다 생성. (GitHub Actions cron은 최소 5분 단위, 부하 시 지연 가능)
# 운영 전환 시 이 스케줄을 '0 15 * * *'(매일 00:00 KST) 등으로 바꾸면 된다.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # 수동 실행 버튼

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger generate endpoint
        run: |
          curl -fsS -X POST "https://bbungka.vercel.app/api/cron/generate" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
