name: 뻥카뉴스 기사 생성

# 정기 생성은 Vercel Cron(vercel.json, 매일 00:00 KST)이 담당한다.
# 이 워크플로는 필요할 때 기사를 한 편 더 뽑는 수동 트리거 전용.
on:
  workflow_dispatch: {} # 수동 실행 버튼

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger generate endpoint
        run: |
          curl -fsS -X POST "https://bbungka.vercel.app/api/cron/generate" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
